services:
  - type: web
    name: ymetalife-server
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: LIVEKIT_MAX_PARTICIPANTS
        value: "5"
      - key: LIVEKIT_TOKEN_TTL
        value: 6h